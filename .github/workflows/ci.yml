name: CI

# Gate every PR + push-to-main on a passing build. Catches the kind of
# regressions we've actually been seeing: broken Relay codegen,
# TypeScript breaks after merging back-to-back PRs, ESLint violations,
# and broken pure helpers (favorites / recap URL / theme).
#
# Production Hosting deploy is deploy-prod.yml on push to main. This
# workflow is the gate before you merge, not the deploy.

on:
  # Feature-branch commits run once, via pull_request. push is only main
  # (the merge result), so a push to the PR branch does not build that
  # same SHA a second time.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Newer commits on the same PR or branch cancel the in-progress build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # tsc runs as part of `npm run build`. We split unit tests out
      # because they're fast and fail loudly when they break, which is
      # nice signal-vs-noise on a PR.
      - name: Unit tests
        run: npm run test

      # Lint is informational for now — the repo has ~33 pre-existing
      # `no-explicit-any` errors that we'll clean up incrementally.
      # Once they're gone, flip `continue-on-error` to false so lint
      # becomes a hard gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # `build` is the heavy step: relay-compiler → tsc -b → vite build.
      # Any of those three failing here means the PR can't merge.
      - name: Build
        run: npm run build
