name: Deploy main to Firebase Hosting

# Fires on push to main (the merge). Builds the app and pushes it to both
# hosting sites (spark-new-admin → admin.igniteproductions.co,
# spark-new-client → client.igniteproductions.co).
#
# This is the only automatic Hosting deploy. Pull requests build and
# test in ci.yml; they do not deploy. develop does not auto-deploy
# (deploy-hosting.yml is workflow_dispatch only).
#
# Why the explicit `firebase target:apply` step? — see the verbose
# comment in deploy-hosting.yml. Short version: service-account auth
# in CI doesn't inherit the local .firebaserc target mapping, so we
# have to register the mapping in-place each run.
#
# This file replaces the older FirebaseExtended/action-hosting-deploy
# config that didn't know about the admin/client target split and
# failed every main push with:
#   "Deploy target admin not configured for project ***"
#
# Auth: FIREBASE_SERVICE_ACCOUNT_DENO is firebase-adminsdk-fbsvc@
# spark-479222 (not github-hosting-deployer). That SA needs
# roles/firebasehosting.admin + roles/serviceusage.serviceUsageConsumer
# on spark-479222. firebase-tools@latest calls Service Usage before
# Hosting deploy; without those roles CI fails 403 on
# serviceusage.googleapis.com even when the build succeeded.
# Prefer granting those two roles over reminting keys.
#
# Never deploy a Hosting channel from a prebuilt artifact that was
# compiled without the VITE_* secrets — that ships
# `clientId: void 0` and breaks Google login. Always `npm run build`
# in this job with the secrets below, then deploy that dist/.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      only_spark:
        description: 'Deploy only spark.igniteproductions.co (301 to client). Skip admin and client.'
        type: boolean
        default: false

# A newer push to main cancels a deploy that is still queued. A deploy
# that has already started uploading is not cancelled; firebase deploy
# is not safe to kill mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: spark-479222
  # Same quota project local tip deploys use. Without it, ADC can
  # bill/check Service Usage against a different project and 403.
  GOOGLE_CLOUD_QUOTA_PROJECT: spark-479222

jobs:
  build_and_deploy:
    if: ${{ github.event_name == 'push' || inputs.only_spark != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # Fail closed before Vite compiles — empty secrets bake
      # `clientId: void 0` into the bundle and break prod login.
      - name: Require Vite build secrets
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
          VITE_MOBILE_LOGIN_URL: ${{ secrets.VITE_MOBILE_LOGIN_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          missing=0
          for name in VITE_GOOGLE_CLIENT_ID VITE_GRAPHQL_ENDPOINT VITE_MOBILE_LOGIN_URL VITE_GOOGLE_MAPS_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is empty — refusing env-less Hosting build"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Vite build secrets present (values not printed)."

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
          VITE_MOBILE_LOGIN_URL: ${{ secrets.VITE_MOBILE_LOGIN_URL }}
          # Browser-side Google Maps key. Public by design (it ships
          # in the bundle), restricted to admin/client.igniteproductions.co
          # via HTTP referrer rules in GCP Console. Without this var,
          # every map widget on the site falls back to the "Google Maps
          # not configured" empty state — Kyle hit this on /account-map.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Set up Firebase auth
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DENO }}' > "$HOME/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json" >> "$GITHUB_ENV"
          # Identity only — never print private_key.
          python3 -c "import json; print('CI SA:', json.load(open('$HOME/firebase-key.json'))['client_email'])"

      - name: Apply hosting targets
        run: |
          firebase target:apply hosting admin spark-new-admin --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive
          firebase target:apply hosting client spark-new-client --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy hosting:admin (spark-new-admin)
        run: firebase deploy --only hosting:admin --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy hosting:client (spark-new-client)
        run: firebase deploy --only hosting:client --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      # spark.igniteproductions.co CNAMEs to the default site of project
      # spark-front-client-prod — a different Firebase project than
      # spark-479222 (admin/client). Kyle's user can see that project
      # but cannot deploy Hosting there; the pre-split PROD service
      # account can. Isolated so a miss cannot roll back admin.
      - name: Deploy hosting:spark (spark.igniteproductions.co)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-prod-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase target:apply hosting spark spark-front-client-prod --project spark-front-client-prod --non-interactive
          firebase deploy --only hosting:spark --project spark-front-client-prod --non-interactive

      - name: Clean up Firebase auth file
        if: always()
        run: rm -f "$HOME/firebase-key.json"

  # Local `firebase deploy --only hosting:spark` needs a valid CLI login.
  # This job ships just the leftover spark. host from any branch via
  # workflow_dispatch, using the pre-split PROD Firebase project.
  deploy_spark_only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.only_spark == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Set up Firebase auth
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' > "$HOME/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json" >> "$GITHUB_ENV"

      - name: Deploy hosting:spark (spark.igniteproductions.co)
        run: |
          firebase target:apply hosting spark spark-front-client-prod --project spark-front-client-prod --non-interactive
          firebase deploy --only hosting:spark --project spark-front-client-prod --non-interactive

      - name: Clean up Firebase auth file
        if: always()
        run: rm -f "$HOME/firebase-key.json"
