name: Deploy main to Firebase Hosting

# Fires on every push to main. Builds the app and pushes it to both
# hosting sites (spark-new-admin → admin.igniteproductions.co,
# spark-new-client → client.igniteproductions.co).
#
# Architecture mirrors deploy-hosting.yml (which runs on develop):
# both flows deploy to the SAME Firebase project + sites because
# we currently have one prod environment. Develop and main both
# push to live. The split exists so the long-running develop branch
# can keep flowing while main is reserved for release-tag commits.
#
# Why the explicit `firebase target:apply` step? — see the verbose
# comment in deploy-hosting.yml. Short version: service-account auth
# in CI doesn't inherit the local .firebaserc target mapping, so we
# have to register the mapping in-place each run.
#
# This file replaces the older FirebaseExtended/action-hosting-deploy
# config that didn't know about the admin/client target split and
# failed every main push with:
#   "Deploy target admin not configured for project ***"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      only_spark:
        description: 'Deploy only spark.igniteproductions.co (301 to client). Skip admin and client.'
        type: boolean
        default: false

env:
  FIREBASE_PROJECT_ID: spark-479222

jobs:
  build_and_deploy:
    if: ${{ github.event_name == 'push' || inputs.only_spark != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
          VITE_MOBILE_LOGIN_URL: ${{ secrets.VITE_MOBILE_LOGIN_URL }}
          # Browser-side Google Maps key. Public by design (it ships
          # in the bundle), restricted to admin/client.igniteproductions.co
          # via HTTP referrer rules in GCP Console. Without this var,
          # every map widget on the site falls back to the "Google Maps
          # not configured" empty state — Kyle hit this on /account-map.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Set up Firebase auth
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DENO }}' > "$HOME/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json" >> "$GITHUB_ENV"

      - name: Apply hosting targets
        run: |
          firebase target:apply hosting admin spark-new-admin --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive
          firebase target:apply hosting client spark-new-client --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy hosting:admin (spark-new-admin)
        run: firebase deploy --only hosting:admin --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy hosting:client (spark-new-client)
        run: firebase deploy --only hosting:client --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      # spark.igniteproductions.co CNAMEs to spark-front-client-prod, which
      # still lives on the pre-split Firebase project
      # (FIREBASE_PROJECT_ID_PROD / FIREBASE_SERVICE_ACCOUNT_PROD) — not
      # spark-479222. Isolated so a missing site cannot roll back admin.
      - name: Deploy hosting:spark (spark.igniteproductions.co)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-prod-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase target:apply hosting spark spark-front-client-prod --project "${{ secrets.FIREBASE_PROJECT_ID_PROD }}" --non-interactive
          firebase deploy --only hosting:spark --project "${{ secrets.FIREBASE_PROJECT_ID_PROD }}" --non-interactive

      - name: Clean up Firebase auth file
        if: always()
        run: rm -f "$HOME/firebase-key.json"

  # Local `firebase deploy --only hosting:spark` needs a valid CLI login.
  # This job ships just the leftover spark. host from any branch via
  # workflow_dispatch, using the pre-split PROD Firebase project.
  deploy_spark_only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.only_spark == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Set up Firebase auth
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' > "$HOME/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json" >> "$GITHUB_ENV"

      - name: Deploy hosting:spark (spark.igniteproductions.co)
        run: |
          firebase target:apply hosting spark spark-front-client-prod --project "${{ secrets.FIREBASE_PROJECT_ID_PROD }}" --non-interactive
          firebase deploy --only hosting:spark --project "${{ secrets.FIREBASE_PROJECT_ID_PROD }}" --non-interactive

      - name: Clean up Firebase auth file
        if: always()
        run: rm -f "$HOME/firebase-key.json"
