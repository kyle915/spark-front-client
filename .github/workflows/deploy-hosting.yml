name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Why this workflow does its own firebase-tools dance instead of
# using FirebaseExtended/action-hosting-deploy@v0:
#
# `firebase.json` defines TWO hosting blocks — one with target "admin"
# (→ spark-new-admin.web.app) and one with target "client"
# (→ spark-new-client.web.app). Both live behind the same Firebase
# project (spark-479222) and the resource → target mapping lives in
# `.firebaserc`.
#
# When FirebaseExtended/action-hosting-deploy runs `firebase deploy
# --only hosting`, it auths via service account but ignores local
# `.firebaserc` target mappings. The deploy then fails with:
#
#   Error: Deploy target admin not configured for project ***
#
# Fix: drive firebase-tools directly. Auth via GOOGLE_APPLICATION_-
# CREDENTIALS (written from the service-account secret), then run two
# explicit `firebase deploy --only hosting:admin / hosting:client`
# steps. Each one names the target so resolution works.
#
# Locally `firebase deploy --only hosting` already works because the
# user's `.firebaserc` has both targets applied. CI just needed to
# stop pretending the action could figure that out on its own.

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
          VITE_MOBILE_LOGIN_URL: ${{ secrets.VITE_MOBILE_LOGIN_URL }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      # Write the service-account JSON to a file so the firebase CLI
      # picks it up via Application Default Credentials. The secret
      # contents are the same JSON the FirebaseExtended action uses
      # today — no new secret needed.
      - name: Set up Firebase auth
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DENO }}' > "$HOME/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json" >> "$GITHUB_ENV"

      - name: Deploy hosting:admin (spark-new-admin)
        run: firebase deploy --only hosting:admin --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy hosting:client (spark-new-client)
        run: firebase deploy --only hosting:client --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Clean up Firebase auth file
        if: always()
        run: rm -f "$HOME/firebase-key.json"
