name: Deploy to Firebase Hosting

on:
  # Production Hosting deploys on push to main in deploy-prod.yml.
  # This file is the manual escape hatch only. It does not run on
  # pull_request and it does not run on push to develop.
  workflow_dispatch:

# Queued runs of this ref are cancelled. An upload already in progress
# is not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Background — why this workflow is shaped the way it is:
#
# `firebase.json` defines two hosting blocks (target "admin" →
# Firebase site spark-new-admin, public host admin.igniteproductions.co;
# target "client" → spark-new-client / spark.igniteproductions.co).
# The resource → target mapping lives in `.firebaserc` keyed by
# project ID. The first CI fix attempt (just naming the targets in
# `--only hosting:admin / hosting:client`) still failed with:
#
#   Error: Deploy target admin not configured for project ***
#
# Two reasons that target lookup misses in CI:
#   1. The `.firebaserc` mapping is keyed by project ALIAS, and
#      `FIREBASE_PROJECT_ID` secret may resolve to a different
#      identifier (number vs alias) — `.firebaserc[targets][<alias>]`
#      isn't found.
#   2. Service-account auth bypasses the per-project mapping the CLI
#      builds from your local login state.
#
# Robust fix: explicitly `firebase target:apply hosting <target>
# <resource>` BEFORE deploying. That writes the mapping into the
# project context CI is using, regardless of what `FIREBASE_PROJECT_ID`
# resolves to. Then `firebase deploy --only hosting:admin` finds it.
#
# Locally `firebase deploy --only hosting` works because kyle has the
# targets pre-applied in his checkout — CI starts from scratch each run.
#
# Auth / IAM: same as deploy-prod.yml — FIREBASE_SERVICE_ACCOUNT_DENO
# (firebase-adminsdk-fbsvc@spark-479222) needs firebasehosting.admin +
# serviceusage.serviceUsageConsumer. Always build with VITE_* secrets
# in this job; never redeploy a secret-less dist/ artifact.

# Project ID is visible in `.firebaserc` (not sensitive) and the
# previous `FIREBASE_PROJECT_ID` secret was resolving to a different
# project that didn't own the spark-new-admin/spark-new-client sites,
# producing `could not find site "spark-new-admin" for project "***"`.
# Hardcoding it as a workflow-level env so every step has a single
# source of truth.
env:
  FIREBASE_PROJECT_ID: spark-479222
  GOOGLE_CLOUD_QUOTA_PROJECT: spark-479222

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Require Vite build secrets
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
          VITE_MOBILE_LOGIN_URL: ${{ secrets.VITE_MOBILE_LOGIN_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          missing=0
          for name in VITE_GOOGLE_CLIENT_ID VITE_GRAPHQL_ENDPOINT VITE_MOBILE_LOGIN_URL VITE_GOOGLE_MAPS_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is empty — refusing env-less Hosting build"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Vite build secrets present (values not printed)."

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
          VITE_MOBILE_LOGIN_URL: ${{ secrets.VITE_MOBILE_LOGIN_URL }}
          # Same key the prod workflow uses — see deploy-prod.yml for
          # the why. Without this, all map widgets on the develop
          # deploy show the "Google Maps not configured" empty state.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      # Service-account JSON → file on disk → ADC pickup. Same secret
      # the FirebaseExtended action used; no new env required.
      - name: Set up Firebase auth
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DENO }}' > "$HOME/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json" >> "$GITHUB_ENV"
          python3 -c "import json; print('CI SA:', json.load(open('$HOME/firebase-key.json'))['client_email'])"

      # Explicitly register the target → resource mapping in CI's
      # project context so `--only hosting:admin / hosting:client`
      # resolves regardless of what FIREBASE_PROJECT_ID resolves to.
      # This rewrites the checked-out `.firebaserc` in-place; the
      # CLI then has the mapping it needs.
      - name: Apply hosting targets
        run: |
          firebase target:apply hosting admin spark-new-admin --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive
          firebase target:apply hosting client spark-new-client --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy hosting:admin (spark-new-admin)
        run: firebase deploy --only hosting:admin --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy hosting:client (spark-new-client)
        run: firebase deploy --only hosting:client --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Clean up Firebase auth file
        if: always()
        run: rm -f "$HOME/firebase-key.json"
