<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=https://client.igniteproductions.co/" />
    <title>Redirecting to Spark</title>
    <script>
      (function () {
        location.replace(
          "https://client.igniteproductions.co" +
            location.pathname +
            location.search +
            location.hash
        );
      })();
    </script>
  </head>
  <body>
    <p>
      Spark moved to
      <a href="https://client.igniteproductions.co/">client.igniteproductions.co</a>.
    </p>
  </body>
</html>
