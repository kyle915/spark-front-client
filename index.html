<!DOCTYPE html>
<html lang="en" data-theme="spark-v2">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spark by Ignite</title>

    <!-- Brand fonts — Space Grotesk for display, JetBrains Mono for
         labels/ASCII, Bungee for the stencil mark. SELF-HOSTED
         (public/fonts/) so first paint makes zero third-party
         requests; woff2s are immutable-cached like other assets.
         Preload the latin Space Grotesk face in parallel with HTML/CSS
         so headings and body paint without waiting on fonts.css. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/V8mDoQDjQSkFtoMM3T6r8E7mPbF4C_k3HqU.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <script>
      (function () {
        try {
          const host = location.hostname;
          if (host === "spark.igniteproductions.co" || host === "www.spark.igniteproductions.co") {
            location.replace("https://client.igniteproductions.co" + location.pathname + location.search + location.hash);
            return;
          }
        } catch (e) {}
        try {
          const scheme =
            localStorage.getItem("@color-scheme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");

          const root = document.documentElement;
          root.setAttribute("color-scheme", scheme);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
