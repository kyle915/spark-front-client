<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark by Ignite</title>

    <!-- Brand fonts — Space Grotesk for display, JetBrains Mono for
         labels/ASCII, Bungee for the stencil mark. SELF-HOSTED
         (public/fonts/) so first paint makes zero third-party
         requests; woff2s are immutable-cached like other assets. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <script>
      (function () {
        try {
          const scheme =
            localStorage.getItem("@color-scheme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");

          const root = document.documentElement;
          root.setAttribute("color-scheme", scheme);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
